name: Construccion de imagen y despliegue con docker en EC2
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Construir imagen de Docker y subir al repositorio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build ond push
        uses: docker/build-push-action@v4
        with:
          context: 
          password: true
          tags: dalyanacarvajal/isa-docker:flaskapp

          
      - name: Deployment
        uses: appleboy/ssh-action@v1.8
        with:
          hosts: ${{ secrets.SSH_HOST }} 
          username: ${{ secrets.SSH_USER }} 
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker image pull dalyanacarvajal/isa-docker:flaskapp
            docker container stop contflaskdaly
            docker container rm contflaskdaly
            docker container run -d --name contflaskdaly -p 80:5000
          
